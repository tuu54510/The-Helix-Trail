<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<title>The Helix Trail</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rye&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--red:#b00d27;--deep:#7a0a1c;--pink:#fbe3e6;--ink:#3b0610;--mint:#b00d27;--amber:#7a0a1c;--rose:#7a0a1c;--mute:#7a2a35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}

body{margin:0;background:var(--red);color:#fff;font:19px/1.5 "Alegreya Sans",Georgia,serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 72px}
.px{font-family:"Press Start 2P",ui-monospace,monospace;line-height:1.5;font-weight:400}
h1,h2{font-family:Rye,Georgia,serif;line-height:1.25;font-weight:400;letter-spacing:.02em}
h1{font-size:36px;color:#fff;margin:8px 0}
h2{font-size:21px;color:var(--red);margin:0 0 10px}
.box{background:#fff;color:var(--ink);border:3px solid #fff;padding:14px;margin:12px 0}
.trail{margin:8px 0 4px;filter:drop-shadow(0 4px 0 rgba(59,6,16,.35))}
.trail svg{display:block;width:100%;height:auto}
.bob{animation:bob .9s steps(1,end) .8s infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@media (prefers-reduced-motion:reduce){.bob,.roll .bob,.bar.hurt{animation:none}}
.stops{display:flex;justify-content:space-between;font-size:15px;color:#fde8ea}
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mem{border:2px solid var(--red);padding:8px;font-size:15px}
.mem.out b,.mem.out .mute{opacity:.6}
.mh{display:flex;align-items:center;gap:8px}.av{flex:none}
.bar{height:10px;background:var(--pink);border:2px solid var(--red);margin-top:4px}
.bar i{display:block;height:100%;background:var(--red);transition:width .5s}
button{font:inherit;color:var(--ink);background:#fff;border:3px solid var(--red);padding:11px 14px;margin:6px 0;width:100%;text-align:left;cursor:pointer}
button:hover:not(:disabled){background:var(--pink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button.go{background:var(--red);color:#fff;font-weight:700;text-align:center}
button.go:hover:not(:disabled){background:var(--deep)}
button.ok{background:var(--red);color:#fff}
button.bad{border-style:dashed;text-decoration:line-through}
button:disabled{cursor:default}
.geno{border:2px dashed var(--red);padding:10px;margin:10px 0;font-size:16px}
.good{color:var(--red);font-weight:700}.badc{color:var(--deep);font-weight:700}
.mute{color:var(--mute)}.tok{color:var(--deep);font-weight:700}
.clue{display:block;margin-top:8px;border-left:4px solid var(--red);padding-left:10px;color:var(--mute)}
.bar.hurt{animation:flash 1.6s steps(1,end) infinite}
@keyframes flash{0%,70%{opacity:1}75%{opacity:.15}85%{opacity:1}90%{opacity:.15}100%{opacity:1}}
.mbtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:auto;margin:0;padding:8px 12px;font-size:14px;text-align:center;border-color:#fff;z-index:5}
.trail{position:relative}
.lbl{position:absolute;transform:translateX(-50%);background:#fff;color:var(--ink);border:1.5px solid var(--red);padding:0 5px;font:10px/1.35 Rye,Georgia,serif;white-space:nowrap;z-index:2}
.lbl::after{content:"";position:absolute;top:100%;left:calc(50% + var(--d,0px));margin-left:-4px;border:4px solid transparent;border-top-color:var(--red)}
.lbl.dn::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--red)}
.roll .bob{animation:bob .24s steps(1,end) infinite}
.scene{display:block;width:100%;height:auto;border:3px solid var(--red);margin:10px 0;background:#fff}
.rc{transition:transform 1s steps(10)}
.wv{animation:wv 1s steps(4) infinite}@keyframes wv{to{transform:translateX(-16px)}}
.arc{background:var(--ink);color:#fff;padding:14px;margin:12px 0;text-align:center}
.arc .at{font-size:14px;color:#fff;margin:0 0 10px}
.ar{display:flex;justify-content:space-between;gap:8px;font:9px/2.2 "Press Start 2P",ui-monospace,monospace;color:#fbe3e6;text-align:left}
.as{font-size:18px;color:#fff;margin:14px 0 6px}
.ah{font-size:10px;color:#fbe3e6;min-height:1.6em;margin:0}
.ar2{font-size:14px;color:#fff;margin:6px 0 0}.rk{color:var(--ink);background:#fff;padding:2px 8px}
.blink{animation:blk 1s steps(1,end) infinite}@keyframes blk{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.rc{transition:none}.wv,.blink{animation:none}}
.bb{display:inline-block;min-width:96px;padding:10px 16px;background:var(--red);color:#fff;font-size:44px;border:3px solid var(--ink)}
</style></head>
<body><main id="app"></main><button class="mbtn" id="mus" aria-pressed="true">Music: on</button>
<script>
const STOPS=[
{place:"Pharmacy Fields",who:"Wayne",age:34,drug:"Pain after tonsil surgery",story:"Wayne needs an oral opioid for a few days. Codeine is on the shelf.<span class='clue'>Chart note: after a normal dose of codeine cough syrup last winter he felt dizzy, sweaty and drowsy, and his mother says the same happens to her.</span>",gene:"CYP2D6",geno:"*1/*1xN (extra gene copies)",pheno:"Ultrarapid metabolizer",
opts:[["Codeine, standard dose",0,"CYP2D6 turns codeine into morphine. An ultrarapid metabolizer makes too much, too fast, risking toxicity and breathing problems."],["Ibuprofen plus acetaminophen",1,"Right. Guidelines say avoid codeine and tramadol in ultrarapid metabolizers and use an agent not dependent on CYP2D6."],["Tramadol, standard dose",0,"Tramadol is also activated by CYP2D6, so the same danger applies."]],
fact:"Codeine and tramadol are prodrugs: they only work after CYP2D6 converts them."},
{place:"Dosage Ridge",who:"Susan",age:62,drug:"Antiplatelet after a heart stent",story:"Susan just got a coronary stent and needs to prevent clots. Clopidogrel is the usual first choice.<span class='clue'>Chart note: her sister took clopidogrel faithfully, yet her stent clotted. Her cardiologist said the drug “just doesn’t take” in some people.</span>",gene:"CYP2C19",geno:"*2/*2",pheno:"Poor metabolizer",
opts:[["Clopidogrel 75 mg daily",0,"Clopidogrel is a prodrug activated by CYP2C19. Poor metabolizers get little active drug and a higher risk of clots and stent failure."],["Ticagrelor (or prasugrel) instead",1,"Right. These work without CYP2C19 activation, so the genotype doesn’t reduce their effect."],["Clopidogrel, double dose",0,"Dose increases don’t reliably fix a lack of activating enzyme. Choose a different drug."]],
fact:"The CYP2C19*2 allele has no function. Two copies means almost no activation."},
{place:"Warfarin Wash",who:"Oscar",age:71,drug:"Warfarin for atrial fibrillation",story:"Oscar needs a blood thinner. The standard start is about 5 mg a day.<span class='clue'>Chart note: he bruises and nosebleeds easily, and his daughter needed an unusually small warfarin dose to stay in range.</span>",gene:"CYP2C9 + VKORC1",geno:"CYP2C9 *1/*3 and VKORC1 −1639 A/A",pheno:"Slow clearance, high sensitivity",
opts:[["Standard 5 mg, check INR later",0,"Too much drug builds up in this patient and the target enzyme is extra sensitive. Bleeding risk rises."],["Lower starting dose, close INR checks",1,"Right. Both genes push toward a lower dose. Genotype-guided dosing still needs INR monitoring."],["Lower dose, skip INR monitoring",0,"Dose is only half the story. Warfarin always needs INR monitoring."]],
fact:"Two genes at once: CYP2C9 controls how fast warfarin is cleared and VKORC1 sets how sensitive the target is."},
{place:"Capsule Canyon",who:"David",age:58,drug:"HIV treatment",story:"David is starting antiretrovirals. A once-daily abacavir combo looks convenient.<span class='clue'>Chart note: his cousin, who has HIV, developed fever, rash and vomiting within weeks of starting one of these medicines and was told never to take it again.</span>",gene:"HLA-B",geno:"*57:01 positive",pheno:"High risk of hypersensitivity",
opts:[["Abacavir combination as planned",0,"HLA-B*57:01 carriers can have a severe, potentially fatal hypersensitivity reaction to abacavir."],["Abacavir at half dose",0,"This is an immune reaction, not a dose effect. Any exposure is risky."],["A regimen without abacavir",1,"Right. Abacavir is contraindicated for carriers, so pick another regimen."]],
fact:"This is an immune-system gene, not a metabolism gene. Screening before prescribing is standard care."},
{place:"Thiopurine Flats",who:"Wayne",age:34,drug:"Azathioprine for Crohn’s disease",story:"Wayne’s gut disease flares again. His doctor suggests azathioprine.<span class='clue'>Chart note: on a short trial of a related drug years ago, his blood counts crashed and he caught infection after infection.</span>",gene:"TPMT",geno:"*3A/*3A",pheno:"Poor metabolizer",
opts:[["Standard dose, blood counts monthly",0,"Without TPMT, toxic metabolites pile up and can wipe out bone marrow. Standard dosing is dangerous."],["Alternative drug, or about 10% of the dose",1,"Right. Guidelines say choose an alternative or cut the dose drastically, with careful monitoring."],["Standard dose, no monitoring",0,"The worst of both worlds."]],
fact:"A poor metabolizer on a standard dose can suffer life-threatening myelosuppression."},
{place:"Statin Summit",who:"Susan",age:62,drug:"Cholesterol lowering",story:"Susan’s cholesterol is high. Simvastatin 40 mg is on her chart.<span class='clue'>Chart note: on a low dose of a statin years ago her thighs ached so badly she could barely climb stairs, and she stopped taking it.</span>",gene:"SLCO1B1",geno:"*5/*5",pheno:"Low transporter function",
opts:[["Simvastatin 80 mg",0,"Higher simvastatin exposure in this genotype greatly raises the risk of muscle damage."],["Simvastatin 40 mg as charted",0,"Still too much exposure for this genotype."],["A lower-risk statin like rosuvastatin at a modest dose",1,"Right. Guidelines suggest a lower dose or a different statin and watching for muscle symptoms."]],
fact:"SLCO1B1 encodes a liver transporter. If it works poorly, more drug stays in the blood."},
{place:"Tablet Mesa",who:"Oscar",age:71,drug:"Allopurinol for gout",story:"Oscar’s gout keeps flaring, and his doctor wants a daily drug to lower his uric acid. Allopurinol is the usual first choice.<span class='clue'>Chart note: his nephew started a gout medicine and within weeks developed a blistering, peeling skin rash that put him in a burn unit.</span>",gene:"HLA-B",geno:"*58:01 positive",pheno:"High risk of severe skin reaction",
opts:[["Allopurinol at the standard starting dose",0,"HLA-B*58:01 carriers have a much higher risk of life-threatening skin reactions (SJS/TEN) with allopurinol."],["Allopurinol, started very low and raised slowly",0,"Slow titration helps everyone, but guidelines say carriers should avoid allopurinol altogether."],["A different urate-lowering drug, such as febuxostat",1,"Right. For HLA-B*58:01 carriers, guidelines say to avoid allopurinol and choose an alternative."]],
fact:"Like abacavir, allopurinol hypersensitivity is driven by an immune gene, not by how fast the drug is cleared."},
{place:"Elixir Bay",who:"David",age:58,drug:"Antidepressant for depression",story:"David has felt low for months, and his doctor suggests citalopram. The usual plan is 20 mg to start, rising toward 40 mg.<span class='clue'>Chart note: a small dose of an antidepressant once left him drowsy and shaky with a pounding heartbeat, and his brother had the same trouble.</span>",gene:"CYP2C19",geno:"*2/*3",pheno:"Poor metabolizer",
opts:[["Citalopram 40 mg from day one",0,"A poor metabolizer clears citalopram slowly, so levels climb high and can affect heart rhythm (QT prolongation)."],["A lower starting dose, titrated slowly",1,"Right. Guidelines suggest a lower starting dose and slower titration, and watching for side effects."],["Start at 20 mg, then raise to 60 mg quickly",0,"60 mg is above the maximum, and this patient is especially likely to accumulate the drug."]],
fact:"CYP2C19 cuts both ways: it activates clopidogrel but clears citalopram, so poor metabolizers face opposite problems."}];
const NAMES=["Wayne","Susan","Oscar","David"];
const PLACES=STOPS.map(x=>x.place).concat("Genomics Gulch");
let S;const app=document.getElementById("app");
const esc=s=>s;
let AC;
function tone(f,t0,d,type,v){const T=AC.currentTime+t0,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,T);g.gain.linearRampToValueAtTime(v,T+.01);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d+.05)}
function sfx(ok){try{getAC();if(ok){tone(1319,0,.9,"sine",.3);tone(2638,0,.5,"sine",.08)}else[392,330,262].forEach((f,i)=>tone(f,i*.2,.3,"triangle",.3))}catch(e){}}
const MEL=["A4 _ D5 _ F#5 _ E5 D5","B4 _ D5 _ G5 _ F#5 E5","F#5 _ A5 _ F#5 _ E5 D5","C#5 _ E5 _ A5 _ G5 E5","D5 _ F#5 _ A5 _ F#5 D5","G5 _ B5 _ A5 G5 F#5 E5","E5 _ C#5 _ A4 _ B4 C#5","D5 _ _ _ A4 _ _ _"];
const CH=["D","G","D","A","D","G","A","D"];
const CHD={D:{b:[50,57],s:[57,62,66]},G:{b:[55,50],s:[59,62,67]},A:{b:[57,52],s:[57,61,64]}};
const NV={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const hz=m=>440*Math.pow(2,(m-69)/12),nn=x=>{const m=x.match(/^([A-G])(#?)(\d)$/);return (+m[3]+1)*12+NV[m[1]]+(m[2]?1:0)};
const LS={};(()=>{let last;MEL.forEach((bar,b)=>bar.split(" ").forEach((x,e)=>{if(x==="-")last=null;else if(x==="_"){if(last)last.len+=2}else{last={m:nn(x),len:2};LS[b*16+e*2]=last}}))})();
const MU={on:true,t:null,st:0,nt:0};let MG,NB;
let SA;
function silentWav(){const n=8000,b=new Uint8Array(44+n),d=new DataView(b.buffer),w=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));w(0,"RIFF");d.setUint32(4,36+n,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,8000,true);d.setUint32(28,8000,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,"data");d.setUint32(40,n,true);b.fill(128,44);let t="";for(const x of b)t+=String.fromCharCode(x);return"data:audio/wav;base64,"+btoa(t)}
function unlockSpeaker(){try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}if(!SA){try{SA=new Audio(silentWav());SA.loop=true;const r=SA.play();if(r&&r.catch)r.catch(()=>{})}catch(e){}}}
function getAC(){unlockSpeaker();AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function mnote(f,T,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,T);g.gain.setValueAtTime(v,T+d*.7);g.gain.linearRampToValueAtTime(0,T+d);o.connect(g);g.connect(MG);o.start(T);o.stop(T+d+.02)}
function mnoise(T,d,v,fr,ft){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=ft;f.frequency.value=fr;g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(.001,T+d);s.connect(f);f.connect(g);g.connect(MG);s.start(T);s.stop(T+d+.02)}
function kick(T){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(220,T);o.frequency.exponentialRampToValueAtTime(90,T+.12);g.gain.setValueAtTime(.55,T);g.gain.exponentialRampToValueAtTime(.001,T+.14);o.connect(g);g.connect(MG);o.start(T);o.stop(T+.16)}
function pluck(f,T,d,v){const o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=f;fl.type="lowpass";fl.frequency.setValueAtTime(3500,T);fl.frequency.exponentialRampToValueAtTime(500,T+d);g.gain.setValueAtTime(0.0001,T);g.gain.linearRampToValueAtTime(v,T+.004);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(fl);fl.connect(g);g.connect(MG);o.start(T);o.stop(T+d+.02)}
function harp(f,T,d,v){const o=AC.createOscillator(),o2=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o2.type="square";o.frequency.value=f;o2.frequency.value=f*1.005;fl.type="lowpass";fl.frequency.value=2600;lf.frequency.value=5.2;lg.gain.value=f*.007;lf.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);g.gain.setValueAtTime(0.0001,T);g.gain.linearRampToValueAtTime(v,T+.04);g.gain.setValueAtTime(v,T+Math.max(d-.06,.05));g.gain.linearRampToValueAtTime(0.0001,T+d);o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(MG);[o,o2,lf].forEach(x=>{x.start(T);x.stop(T+d+.03)})}
function beat(k,T,sx){const b=Math.floor(k/16)%8,p=k%16,C=CHD[CH[b]];
const e=LS[k%128];if(e)harp(hz(e.m),T,e.len*sx*.95,.075);
if(p%8===0)pluck(hz(C.b[p/8]),T,sx*7,.34);

function pump(){const sx=60/104/4;while(MU.nt<AC.currentTime+.25){beat(MU.st,MU.nt,sx);MU.st++;MU.nt+=sx}}
function musicStart(){try{getAC();if(!MG){MG=AC.createGain();MG.gain.value=.6;const CP=AC.createDynamicsCompressor();MG.connect(CP);CP.connect(AC.destination);NB=AC.createBuffer(1,AC.sampleRate*.2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

function musicStop(){clearInterval(MU.t);MU.t=null}
const mb=document.getElementById("mus");
mb.onclick=()=>{MU.on=!MU.on;if(MU.on)musicStart();else musicStop();mb.textContent="Music: "+(MU.on?"on":"off");mb.setAttribute("aria-pressed",MU.on)};
const EV=["click","touchend","keydown"],first=()=>{if(MU.on)musicStart();EV.forEach(e=>document.removeEventListener(e,first))};EV.forEach(e=>document.addEventListener(e,first));
document.addEventListener("visibilitychange",()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(!b||b.classList.contains("opt")||b.dataset.b)return;try{getAC();tone(660,0,.09,"sine",.1)}catch(x){}},true);
function fanfare(){try{getAC();[[523,0,.16],[659,.12,.16],[784,.24,.16],[1047,.36,.8]].forEach(([f,t,d])=>{tone(f,t,d,"triangle",.28);tone(f*2,t,d,"sine",.06)})}catch(e){}}
function animCart(){const c=document.getElementById("cart"),pa=document.getElementById("route");if(!c||!pa||c.dataset.done)return;c.dataset.done=1;
const L=pa.getTotalLength(),pos=q=>{const p=pa.getPointAtLength(L*q);c.setAttribute("transform","translate("+p.x+","+p.y+")")};
const wp=document.getElementById("wps");const NP=PLACES.length-1;for(let k=1;k<NP;k++){const p=pa.getPointAtLength(L*k/NP);wp.insertAdjacentHTML("beforeend",`<circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#fff" stroke="#b00d27" stroke-width="2.5"/>`)}
const a=+c.dataset.from,b=+c.dataset.f,dur=+c.dataset.dur||0;pos(a);
if(dur){const tr=pa.closest(".trail"),sc=pa.ownerSVGElement.getBoundingClientRect().width/600,W=tr.clientWidth,H=140*sc;
const p=pa.getPointAtLength(L*b),d=document.createElement("div");d.className="lbl";d.textContent=c.dataset.lb;tr.appendChild(d);
const w=d.offsetWidth,h=d.offsetHeight,x=Math.min(Math.max(p.x*sc,w/2+2),W-w/2-2),up=p.y*sc-44*sc-h,dn=p.y*sc+8*sc,upOk=up>=2,dnOk=dn+h<=H-2;
const above=upOk||(!dnOk&&-up<=dn+h-H);let top=above?up:dn;top=Math.min(Math.max(top,2),Math.max(H-h-2,2));
if(!above)d.classList.add("dn");d.style.left=x+"px";d.style.top=top+"px";d.style.setProperty("--d",(p.x*sc-x)+"px");
c.classList.add("roll")}
if(a===b||matchMedia("(prefers-reduced-motion:reduce)").matches){pos(b);return}
const N=dur?Math.floor(dur/80):8,ms=dur?80:100;let k=0;const iv=setInterval(()=>{k++;pos(a+(b-a)*k/N);if(k>=N){clearInterval(iv);c.classList.remove("roll")}},ms)}
new MutationObserver(animCart).observe(app,{childList:true});
function balance(){const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);let pos;do{pos=sh(STOPS.map((_,i)=>i%3).slice(0,STOPS.length-2).concat(sh([0,1,2]).slice(0,2)))}while(pos.some((x,i)=>i&&x===pos[i-1]));
return STOPS.map((st,i)=>{const good=st.opts.find(o=>o[1]),a=sh(st.opts.filter(o=>!o[1]));a.splice(pos[i],0,good);return a})}
function start(){S={i:0,tokens:5,used:0,benchUsed:{},bench:[],clean:false,opts:balance(),hp:{Wayne:100,Susan:100,Oscar:100,David:100},tested:false,answered:false,log:[]};
app.innerHTML=`<h1>The Helix Trail</h1><div class="box"><p>You are the wagon pharmacist. Guide four patients from Pharmacy Fields to Genomics Gulch. At each stop a patient needs a drug, and their genes change what is safe.</p><p>You start with <b class="tok">5 dosage kits</b>. Every patient must be tested with a kit before you prescribe, and each kit is used up. Each chart note hints at the patient’s genes, so check your guess against the lab result. Three times on the trail you reach a bench where a timed game earns one more kit. If you reach a patient and have no kits left, the journey ends. A wrong prescription causes an adverse reaction.</p><button class="go" id="go">Start the journey</button></div>`;
document.getElementById("go").onclick=render}
const PEOPLE={Wayne:{skin:"#f1c27d",hair:"#5a3a1e",shirt:"#b00d27",st:"short"},Susan:{skin:"#e8b98a",hair:"#8c8c8c",shirt:"#7a0a1c",st:"bun"},Oscar:{skin:"#f1c27d",hair:"#f2f2f2",shirt:"#3b0610",st:"glasses"},David:{skin:"#8d5524",hair:"#1b1b1b",shirt:"#b00d27",st:"cap"}};
